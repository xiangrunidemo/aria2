name: Build aria2 (patched, 256 conn) Windows exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: i686-w64-mingw32      # 32 位
            arch: win32
          - host: x86_64-w64-mingw32    # 64 位
            arch: win64
    steps:
      - name: Checkout fork（拿 fork 自己的 Dockerfile.mingw）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 让 Dockerfile.mingw 编译 fork 自己的代码
        run: |
          # Dockerfile.mingw 默认 clone 上游 aria2/aria2，改成 clone 本 fork
          sed -i \
            -e 's|api.github.com/repos/aria2/aria2|api.github.com/repos/xiangrunidemo/aria2|g' \
            -e 's|https://github.com/aria2/aria2|https://github.com/xiangrunidemo/aria2|g' \
            Dockerfile.mingw
          echo "=== 改后的 clone 行 ==="
          grep -n "git clone\|api.github" Dockerfile.mingw

      - name: 构建 aria2c.exe (${{ matrix.arch }})
        run: |
          docker build \
            --build-arg HOST=${{ matrix.host }} \
            --build-arg ARIA2_VERSION=master \
            --build-arg ARIA2_REF=refs/heads/master \
            -t aria2-mingw-${{ matrix.arch }} \
            - < Dockerfile.mingw
          docker create --name tmp aria2-mingw-${{ matrix.arch }}
          docker cp tmp:/aria2/src/aria2c.exe ./aria2c-${{ matrix.arch }}.exe
          docker rm tmp
          file aria2c-${{ matrix.arch }}.exe
          ls -lh aria2c-${{ matrix.arch }}.exe

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2c-${{ matrix.arch }}
          path: aria2c-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir release
          find artifacts -name '*.exe' -exec cp {} release/ \;
          ls -lh release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          name: aria2c (256conn) ${{ github.ref_name }}
          generate_release_notes: true
