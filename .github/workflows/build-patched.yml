name: Build aria2 Windows exe

on:
  workflow_dispatch:           # 手动点 Run workflow
  push:
    tags: ['v*']                # 在你仓库打 v 开头的 tag → 自动发版

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: i686-w64-mingw32      # 32 位
            arch: win32
          - host: x86_64-w64-mingw32    # 64 位
            arch: win64
    steps:
      - name: 拉取官方 Dockerfile.mingw
        run: |
          curl -fsSL -o Dockerfile.mingw \
            https://raw.githubusercontent.com/aria2/aria2/master/Dockerfile.mingw
          echo "::group::Dockerfile.mingw"; cat Dockerfile.mingw; echo "::endgroup::"

      - name: 构建 aria2c.exe (${{ matrix.arch }})
        run: |
          docker build \
            --build-arg HOST=${{ matrix.host }} \
            -t aria2-mingw-${{ matrix.arch }} \
            - < Dockerfile.mingw
          docker create --name tmp aria2-mingw-${{ matrix.arch }}
          docker cp tmp:/aria2/src/aria2c.exe ./aria2c-${{ matrix.arch }}.exe
          docker rm tmp
          file aria2c-${{ matrix.arch }}.exe
          ls -lh aria2c-${{ matrix.arch }}.exe

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2c-${{ matrix.arch }}
          path: aria2c-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write              # 发 Release 需要写权限
    steps:
      - name: 下载所有 artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总 exe
        run: |
          mkdir release
          find artifacts -name '*.exe' -exec cp {} release/ \;
          ls -lh release/

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          name: aria2c ${{ github.ref_name }}
