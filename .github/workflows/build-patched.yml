name: Build aria2 patched

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-c-ares
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libssh2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-gettext
            make
            pkg-config
            curl

      - name: Download aria2 release
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}
        run: |
          curl -L -o aria2.tar.gz https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.gz
          tar xzf aria2.tar.gz

      - name: Patch 16 connection limit
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}/aria2-1.37.0
        run: |
          sed -i 's/"1", 1, 16,/ "1", 1, 128,/g' src/OptionHandlerFactory.cc
          grep -n "128" src/OptionHandlerFactory.cc

      - name: Configure
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}/aria2-1.37.0
        run: |
          ./configure --host=x86_64-w64-mingw32

      - name: Build
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}/aria2-1.37.0
        run: make -j2

      - name: Verify
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}/aria2-1.37.0
        run: ./src/aria2c.exe --version

      - name: Collect files
        shell: msys2 {0}
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p dist
          cp aria2-1.37.0/src/aria2c.exe dist/
          # 找出所有依赖的 DLL 并复制
        ldd aria2-1.37.0/src/aria2c.exe | grep /ucrt64/bin | awk '{print $3}' | while read dll; do
            cp "$dll" dist/
          done
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: aria2c-patched-win64
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
